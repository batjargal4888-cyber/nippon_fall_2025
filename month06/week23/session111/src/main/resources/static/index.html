<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <h2>Task Manager</h2>

    <div class="task-container">
        <div class="form-group category-group">
            <input type="text" id="cat-name" placeholder="New Category Name">
            <button class="btn-secondary" onclick="saveCategory()">
                Add Category
            </button>
        </div>

        <hr />

        <div class="form-group">
            <input type="text" id="task-desc" placeholder="What needs to be done?">
            <select id="category-selector">
                <option value="">...Loading</option>
            </select>
            <button onclick="saveTask();">Add Task</button>
        </div>

        <ul id="task-list">

        </ul>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
