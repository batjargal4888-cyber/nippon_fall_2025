<!DOCTYPE html>
<html>

<head>
    <style>
        .highlight {
            background-color: yellow;
            background: yellow;
        }

        .bold {
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .active {
            border: 2px solid blue;
        }
    </style>
</head>

<body>
    <h1 id="title">Original Title</h1>
    <p id="content">Some <strong>bold</strong> text</p>
    <a id="link" href="https://example.com" target="_blank">Link</a>
    <img id="image" src="photo.jpg" alt="Photo">
    <ul id="list">
        <li>Item 1</li>
        <li>Item 2</li>
    </ul>
    <div id="container"></div>

    <div id="output">Hello <span>World</span></div>
    <input type="text" id="name" value="John">

    <div id="user" data-user-id="123" data-user-name="John"></div>

    <a id="myLink" href="https://old.com" target="_blank">Click</a>
    <img id="myImg" src="old.jpg" alt="Old image">
    <div id="card" data-product-id="456" data-category="electronics"></div>

    <div id="box" class="box">Box</div>

    <ul id="todo-list"></ul>
    <div id="cards"></div>

    <script src="./js/ex2.js"></script>
</body>

</html>
