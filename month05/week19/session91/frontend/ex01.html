        // Bagsh bichsen
        const counter = document.getElementById('counter');
        const savedValue = localStorage.getItem('counterValue');

        if (savedValue) {
            counter.textContent = savedValue;
        } else {
            counter.textContent = 0;
        }

        const increment = function () { // anonymous function

            let number = counter.textContent; // string butsaana
            number = parseInt(number); // number -> number integer
            number++;
            counter.textContent = number;
            // save to the local storage
            localStorage.setItem('counterValue', number)
        }

        // reset arrow function
        const reset = () => {
            counter.textContent = 0;
            localStorage.setItem('counterValue', 0);
        }
    </script>
