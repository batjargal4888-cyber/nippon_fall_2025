<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <title>Password Toggle</title>
    <style>
        .password-container {
            position: relative;
            display: inline-block;
        }

        #password {
            padding: 10px;
            padding-right: 40px;
            font-size: 16px;
        }

        #toggleBtn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <h2>Нууц үг оруулах</h2>
    <div class="password-container">
        <input type="password" id="password" placeholder="Нууц үг">
        <button id="toggleBtn">👁️</button>
    </div>

    <script src="./js/pw_show.js"></script>
</body>

</html>
