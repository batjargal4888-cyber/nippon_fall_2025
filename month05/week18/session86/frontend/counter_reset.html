<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <title>Counter App</title>
    <style>
        .counter-app {
            text-align: center;
            padding: 40px;
        }

        #count {
            font-size: 72px;
            margin: 20px 0;
            color: #2c3e50;
        }

        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .increment {
            background: #27ae60;
            color: white;
        }

        .decrement {
            background: #e74c3c;
            color: white;
        }

        .reset {
            background: #95a5a6;
            color: white;
        }
    </style>
</head>

<body>
    <div class="counter-app">
        <h1>Тоолуур Програм</h1>
        <div id="count">0</div>
        <div>
            <button class="decrement" id="decrementBtn">- Хасах</button>
            <button class="reset" id="resetBtn">Дахин эхлүүлэх</button>
            <button class="increment" id="incrementBtn">+ Нэмэх</button>
        </div>
    </div>

    <script src="./js/counter_reset.js"></script>
</body>

</html>
