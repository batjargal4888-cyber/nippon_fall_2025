<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/event01.css">
</head>

<body>
    <h1>JS Mouse Events</h1>
    <main>
        <section>
            <h3>Click Event</h3>
            <div id="output"></div>
            <div id="input">
                <button>Click Me</button>
            </div>
        </section>
        <section>
            <h3>Hover Events</h3>
            <div>
                <p id="hover-text">
                    Hover me
                </p>
            </div>
            <div>
                <input type="text" id="focus-input">
            </div>
        </section>
    </main>
    <script src="./js/event01.js"></script>
</body>
