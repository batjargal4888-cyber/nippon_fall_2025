<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <title>Дасгал 2.1: Modal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        #openModal {
            padding: 15px 30px;
            font-size: 18px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }
    </style>
</head>

<body>
    <h1>Modal Жишээ</h1>
    <button id="openModal">Modal нээх</button>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <h2>Modal Гарчиг</h2>
            <p>Энэ бол modal цонхны агуулга юм.</p>
            <p>Гадна дарах эсвэл ESC товч дарж хааж болно.</p>
        </div>
    </div>

    <script src="./js/ex2-1.js"></script>
</body>

</html>
