<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <title>Дасгал 1.1: Өнгөний товч</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            transition: background-color 0.3s;
        }

        .button-container {
            margin: 20px 0;
        }

        button {
            padding: 15px 30px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 5px;
        }

        #currentColor {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Арын өнгө солигч</h1>

    <div class="button-container">
        <button data-color="#ff6b6b">Улаан</button>
        <button data-color="#4ecdc4">Цэнхэр</button>
        <button data-color="#95e1d3">Ногоон</button>
        <button data-color="#ffe66d">Шар</button>
        <button data-color="#c44569">Ягаан</button>
    </div>

    <div id="currentColor">Одоогийн өнгө: Үндсэн</div>

    <script src="./js/ex1-1.js"></script>
</body>

</html>
