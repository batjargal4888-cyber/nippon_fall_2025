<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <title>Дасгал 1.2: Текст тоолуур</title>
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            resize: vertical;
        }

        .counter {
            margin-top: 10px;
            font-size: 18px;
            text-align: right;
        }

        .normal {
            color: #2ecc71;
        }

        .warning {
            color: #f39c12;
        }

        .danger {
            color: #e74c3c;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Текст Тоолуур</h2>
        <textarea id="textInput" placeholder="Энд бичнэ үү..."></textarea>
        <div class="counter">
            <span id="charCount">0</span> / 200 тэмдэгт
        </div>
    </div>

    <script src="./js/ex1-2.js"></script>
</body>

</html>
