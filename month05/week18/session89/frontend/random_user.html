<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #userList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-card img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .user-card h3 {
            margin: 10px 0 5px;
            font-size: 20px;
        }

        .user-card p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>Users</h1>
    <div id="userList"></div>

    <script>
        const API = 'https://randomuser.me/api/?results=5';
        // Ene API-g ashiglaad 5 hunii zurag, first name, last name, title & nationality
        // gesen medeelliig haruulna uu.
        const userList = document.getElementById("userList");

        fetch(API)
            .then(response => response.json())
            .then(data => {
                console.log(data);
                console.log(data.results);

                // Array -> forEach
                data.results.forEach(user => {
                    console.log(user);
                    const card = document.createElement("div");
                    card.className = "user-card";

                    card.innerHTML = `
                        <img src="${user.picture.large}">
                        <h3>${user.name.title} ${user.name.first} ${user.name.last}</h3>
                        <p>Nationality: ${user.nat}</p>
                        `;

                    // DOM-д нэмэх
                    userList.appendChild(card);
                });
            })
            .catch(error => {
                console.error("Error fetching users:", error);
            })
    </script>
</body>

</html>
