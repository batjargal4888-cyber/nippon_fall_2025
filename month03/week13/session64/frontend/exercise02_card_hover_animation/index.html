<!DOCTYPE html>

    <title>Card Hover Animation (⭐)</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="card-container">

        <div class="card">
            <div class="icon">🎨</div>
            <h3>Card 1</h3>

        <div class="card">

            <p>Энэ бол програмчлалын картын текст.</p>
        </div>

        <div class="card">
            <div class="icon">📱</div>
            <h3>Card 3</h3>
            <p>Энэ бол mobile хөгжүүлэлтийн картын текст.</p>
        </div>

    </div>

</body>

</html>
