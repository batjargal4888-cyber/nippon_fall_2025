<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="ProfileCardStyle.css">
</head>

<body>
    <div class="profile-card-background">

        <div class="profile-card">

            <div class="header">
                <img src="./ProfilePicture.png" class="Avatar">
            </div>

            <div class="body">
                <h2>Johnny Rogers</h2>
                <h3>@johnnyrogers</h3>

                <div class="Social">
                    <img src="./LogoD.png" alt="Dribble">
                    <img src="./LogoFB.png" alt="FB">
                    <img src="./LogoIG.png" alt="IG">
                    <img src="./LogoIN.png" alt="LinkedIn">
                    <img src="./LogoX.png" alt="X">
                </div>

                <p>
                    Crafting brand and communication strategies, creating visual designs, leading art direction, and
                    capturing portraits through photography.
                </p>

                <div class="buttons">
                    <button class="follow-btn">Follow</button>
                    <button class="message-btn">Message</button>
                </div>
            </div>

        </div>

    </div>
</body>

</html>
