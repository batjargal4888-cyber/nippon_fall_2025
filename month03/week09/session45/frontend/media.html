<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>IFrame буюу HTML доторх HTML</h1>
    <a href="./about.html">About HTML</a>
    <section>
        <h2>About Integrated</h2>
        <iframe src="./about.html" frameborder="0" width="200">About Page</iframe>
    </section>
    <section>
        <h2>Youtube Video Integration</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/cRLSKh5ridA?si=zRII7OzCAARIvMyc"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        </iframe>
    </section>
    <section>
        <h1>HTML Video Integrated</h1>
        <video width="320" height="240" controls>
            <source src="./videos/3195394-uhd_3840_2160_25fps.mp4" type="video/mp4">
        </video>
    </section>
    <section>
        <h1>HTML Audio Integrated</h1>
        <audio controls>
            <source src="./audio/file_example_MP3_1MG.mp3" type="audio/mp3">
        </audio>
    </section>
    <section>
        <h1>HTML Map Integrated</h1>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1388.8664670319927!2d106.91689725420116!3d47.92032358260762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5d9692438c74ce17%3A0xd67030cf142c1b4d!2sParliament%20of%20Mongolia!5e0!3m2!1sen!2smn!4v1764313055561!5m2!1sen!2smn"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
</body>

</html>
